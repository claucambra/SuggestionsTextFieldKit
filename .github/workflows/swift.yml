# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-14

    steps:
    - uses: actions/checkout@v3
    # Use the same Xcode toolchain to build, test, and export coverage.
    - name: Build
      run: xcrun swift build -v
    - name: Run tests
      run: xcrun swift test --enable-code-coverage -v
    - name: Gather code coverage
      run: xcrun llvm-cov export -format="lcov" .build/debug/SuggestionsTextFieldKitPackageTests.xctest/Contents/MacOS/SuggestionsTextFieldKitPackageTests -instr-profile .build/debug/codecov/default.profdata > coverage_report.lcov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: fail
        files: ./coverage_report.lcov
        verbose: true
